name: HACS validate

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  validate-hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration
          # Until home-assistant/brands includes ml_brightness
          ignore: brands
